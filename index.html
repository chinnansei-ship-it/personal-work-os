<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>南星 · Personal Work OS</title>
    <meta
      name="description"
      content="每日阅读、月度报告、WIP分析与知识资产的一体化个人工作台"
    />
    <style>
      :root {
        --ink: #173a34;
        --deep: #0f302b;
        --mint: #dcebe3;
        --paper: #f4f2eb;
        --line: #d9ddd5;
        --gold: #d8a64b;
        --rust: #b9573e;
        --white: #fffefa;
        --muted: #718079;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, "STKaiti", "华文楷体", serif;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      .app {
        display: grid;
        grid-template-columns: 238px 1fr;
        min-height: 100vh;
      }
      aside {
        background: var(--deep);
        color: white;
        padding: 30px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 8px 28px;
        border-bottom: 1px solid #ffffff20;
      }
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--gold);
        color: var(--deep);
        font:
          700 20px Arial,
          "STKaiti",
          "华文楷体",
          serif;
      }
      .brand b,
      .brand small {
        display: block;
      }
      .brand small {
        opacity: 0.6;
        font:
          12px Arial,
          "STKaiti",
          "华文楷体",
          serif;
        margin-top: 2px;
      }
      nav {
        display: grid;
        gap: 6px;
        margin-top: 24px;
      }
      nav button {
        background: none;
        border: 0;
        border-radius: 8px;
        text-align: left;
        padding: 12px;
        color: #c7d4cf;
        cursor: pointer;
      }
      nav button.active,
      nav button:hover {
        background: #ffffff12;
        color: white;
        box-shadow: inset 3px 0 var(--gold);
      }
      nav small {
        display: block;
        opacity: 0.55;
        margin-top: 3px;
      }
      main header {
        height: 64px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4vw;
        position: sticky;
        top: 0;
        background: #f4f2ebee;
        backdrop-filter: blur(8px);
        z-index: 2;
      }
      main header b {
        font-size: 13px;
      }
      .content {
        max-width: 1280px;
        margin: auto;
        padding: 48px 4vw 80px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 24px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--rust);
        font-weight: 700;
      }
      .hero h1,
      .intro h1 {
        font:
          700 clamp(40px, 5vw, 66px)/1 Arial,
          "STKaiti",
          "华文楷体",
          serif;
        margin: 8px 0;
      }
      .hero p,
      .intro p {
        color: var(--muted);
      }
      .ready {
        font-size: 11px;
        color: var(--muted);
      }
      .ready:before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #65a27b;
        margin-right: 8px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: white;
        border: 1px solid var(--line);
        margin-bottom: 16px;
      }
      .stats div {
        padding: 15px 20px;
        border-right: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .stats span {
        font-size: 10px;
        color: var(--muted);
        margin-right: auto;
      }
      .stats strong {
        font:
          600 26px Arial,
          "STKaiti",
          "华文楷体",
          serif;
      }
      .modules {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 14px;
      }
      .card {
        grid-column: span 2;
        min-height: 330px;
        background: white;
        border: 1px solid var(--line);
        padding: 22px;
        text-align: left;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition: 0.2s;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px #173a3414;
      }
      .card.large {
        grid-column: span 3;
      }
      .card.dark {
        background: var(--ink);
        color: white;
      }
      .top {
        display: flex;
        justify-content: space-between;
      }
      .num {
        font:
          18px Arial,
          "STKaiti",
          "华文楷体",
          serif;
        color: #aab5af;
      }
      .icon {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--mint);
        display: grid;
        place-items: center;
      }
      .dark .icon {
        background: var(--gold);
        color: var(--deep);
      }
      .card h2 {
        font:
          600 24px Arial,
          "STKaiti",
          "华文楷体",
          serif;
        margin: 26px 0 6px;
      }
      .card p,
      .card li {
        font-size: 11px;
        color: var(--muted);
      }
      .dark p,
      .dark li {
        color: #b6c6c0;
      }
      .card ul {
        list-style: none;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .card li:before {
        content: "·";
        color: var(--gold);
        margin-right: 7px;
      }
      .card footer {
        margin-top: auto;
        border-top: 1px solid #dfe3df;
        padding-top: 15px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
      }
      .dark footer {
        border-color: #ffffff20;
      }
      .intro {
        border-bottom: 1px solid var(--line);
        padding-bottom: 28px;
        margin-bottom: 28px;
      }
      .back {
        border: 1px solid var(--ink);
        background: none;
        border-radius: 50px;
        padding: 7px 14px;
        cursor: pointer;
      }
      .subgrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .sub {
        background: white;
        border: 1px solid var(--line);
        padding: 22px;
        min-height: 170px;
      }
      .sub span {
        font-size: 10px;
        color: var(--rust);
        letter-spacing: 0.12em;
      }
      .sub h3 {
        font:
          600 19px Arial,
          "STKaiti",
          "华文楷体",
          serif;
        margin: 22px 0 8px;
      }
      .sub p {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.6;
      }
      .workflow {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        background: white;
        border: 1px solid var(--line);
      }
      .workflow .sub {
        border: 0;
        border-right: 1px solid var(--line);
      }
      .today {
        margin-top: 44px;
      }
      .today h2 {
        font:
          600 28px Arial,
          "STKaiti",
          "华文楷体",
          serif;
      }
      .daily {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .panel {
        background: white;
        border: 1px solid var(--line);
        padding: 22px;
      }
      .panel h3 {
        font:
          600 20px Arial,
          "STKaiti",
          "华文楷体",
          serif;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        border-top: 1px solid #e5e7e2;
        padding: 10px 0;
      }
      .row i {
        width: 8px;
        height: 8px;
        background: var(--gold);
        border-radius: 50%;
      }
      .row input {
        width: 100%;
        border: 0;
        background: transparent;
        outline: none;
      }
      .reading-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: #fff;
        border: 1px solid var(--line);
        border-left: 4px solid #65a27b;
        padding: 13px 18px;
        margin: 0 0 16px;
      }
      .reading-status.fallback {
        border-left-color: var(--gold);
        background: #fffaf0;
      }
      .reading-status b { font-size: 13px; }
      .reading-status span { font-size: 11px; color: var(--muted); }
      .status-pill {
        display: inline-block;
        margin-top: 12px;
        padding: 5px 9px;
        border-radius: 99px;
        background: #e5f2e9;
        color: #39724c;
        font: 700 10px Arial, sans-serif;
      }
      .status-pill.fallback { background: #fff0cf; color: #93651d; }
      .hidden {
        display: none;
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 76px 1fr;
        }
        .brand div,
        nav small {
          display: none;
        }
        .brand {
          justify-content: center;
        }
        .modules {
          grid-template-columns: 1fr 1fr;
        }
        .card,
        .card.large {
          grid-column: span 1;
        }
        .workflow {
          grid-template-columns: repeat(3, 1fr);
        }
        .subgrid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 600px) {
        .app {
          display: block;
        }
        aside {
          height: auto;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          top: auto;
          z-index: 4;
          padding: 6px;
        }
        .brand {
          display: none;
        }
        nav {
          display: flex;
          margin: 0;
          justify-content: space-around;
        }
        nav button {
          padding: 9px;
          font-size: 0;
        }
        nav button b {
          font-size: 18px;
        }
        .content {
          padding: 30px 17px 90px;
        }
        .modules,
        .subgrid,
        .daily {
          grid-template-columns: 1fr;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .card,
        .card.large {
          grid-column: 1;
        }
        .hero {
          display: block;
        }
        .ready {
          margin-top: 15px;
        }
        .workflow {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <span class="logo">N</span>
          <div><b>南星</b><small>Personal Work OS</small></div>
        </div>
        <nav id="nav"></nav>
      </aside>
      <main>
        <header>
          <b id="crumb">Home / 今日工作台</b
          ><button class="back" onclick="show('home')">回到总览</button>
        </header>
        <div class="content" id="view"></div>
      </main>
    </div>
    <script>
      const sections = {
        home: { icon: "⌂", en: "Home", cn: "今日工作台" },
        reading: { icon: "◐", en: "Daily Reading", cn: "每日阅读" },
        reporting: { icon: "▥", en: "Monthly Reporting", cn: "月度报告" },
        wip: { icon: "◇", en: "WIP Analysis", cn: "WIP 分析" },
        knowledge: { icon: "◎", en: "Knowledge Assets", cn: "数字知识资产" },
      };
      const subs = {
        reading: [
          ["China Retail Pharmacy Brief", "中国零售药房趋势与重点信号"],
          ["Commercial Excellence", "CE 方法论、指标与业务实践"],
          ["Advanced English Practice", "高级商务英语精进"],
          ["Weekend Long Read", "周末深度阅读与思考"],
        ],
        reporting: [
          ["Data Input", "导入 IMS、Offtake、Inventory、Sales / Billing"],
          ["Data Check", "检查完整性、口径与异常值"],
          ["KPI Refresh", "更新核心指标与趋势"],
          ["Variance Analysis", "定位差异、客户与 SKU 贡献"],
          ["Commentary", "形成管理层可读结论"],
          ["Output", "交付报告并归档知识"],
        ],
        wip: [
          ["Dashboard", "总览进度、金额与结构"],
          ["Risk / Gap", "识别缺口与风险优先级"],
          ["Customer Drill-down", "定位重点客户贡献"],
          ["SKU Drill-down", "识别重点产品驱动"],
          ["Action Tracking", "明确 Owner、Deadline 与状态"],
        ],
        knowledge: [
          ["CE Knowledge Base", "方法论、指标与项目实践"],
          ["Meeting Library", "决策、行动与开放问题"],
          ["Operation Analysis Library", "经营分析框架与结论"],
          ["WIP Analysis Library", "风险识别、下钻与行动复盘"],
        ],
      };
      const defaults = {
        priorities: [
          "刷新本月核心数据",
          "完成 WIP 风险扫描",
          "沉淀一条可复用知识",
        ],
        followups: ["确认 IMS 数据到达时间", "补充重点客户行动项"],
        risks: ["重点 SKU 库存周转天数上升"],
      };
      let data =
        JSON.parse(localStorage.getItem("nanxing-gh-os") || "null") || defaults;
      nav.innerHTML = Object.entries(sections)
        .map(
          ([k, v]) =>
            `<button data-id="${k}" onclick="show('${k}')"><b>${v.icon}</b> ${v.en}<small>${v.cn}</small></button>`,
        )
        .join("");
      function rows(key) {
        return data[key]
          .map(
            (x, i) =>
              `<div class="row"><i></i><input value="${x}" onchange="edit('${key}',${i},this.value)"></div>`,
          )
          .join("");
      }
      function edit(k, i, v) {
        data[k][i] = v;
        localStorage.setItem("nanxing-gh-os", JSON.stringify(data));
      }
      function readingStatus() {
        const meta = reads.english.meta || "";
        const fallback = meta.includes("备用");
        return `<div class="reading-status ${fallback ? "fallback" : ""}"><b>${fallback ? "今日英语：备用课程已更新" : "今日英语：完整课程已更新"}</b><span>${meta} · PDF 已生成 · 今日公主配色</span></div>`;
      }
      function home() {
        let cards = [
          [
            "home",
            "01",
            "今日工作台",
            "把今天最重要的事情集中在一个驾驶舱。",
            [
              "Morning Brief",
              "Top 3 Priorities",
              "Meetings",
              "Follow-ups",
              "Risks / Issues",
            ],
          ],
          [
            "reading",
            "02",
            "每日阅读",
            "行业、专业与语言的持续输入。",
            subs.reading.map((x) => x[0]),
          ],
          [
            "reporting",
            "03",
            "月度报告",
            "六步完成数据刷新、检查、分析与输出。",
            [
              "Data Input",
              "Data Check",
              "KPI Refresh",
              "Variance Analysis",
              "Commentary",
              "Output",
            ],
          ],
          [
            "wip",
            "04",
            "WIP 分析",
            "从总览信号下钻到客户、SKU 与行动。",
            subs.wip.map((x) => x[0]),
          ],
          [
            "knowledge",
            "05",
            "数字知识资产",
            "让每次会议与分析都成为可复用资产。",
            subs.knowledge.map((x) => x[0]),
          ],
        ];
        return `<section class="hero"><div><div class="eyebrow">PERSONAL COMMAND CENTER</div><h1>工作总览</h1><p>从一个仪表盘进入每日输入、报告刷新、分析与知识沉淀。</p></div><div class="ready">今日工作台已就绪</div></section><section class="stats"><div><span>今日重点</span><strong>3</strong></div><div><span>今日会议</span><strong>2</strong></div><div><span>待跟进</span><strong>${data.followups.length}</strong></div><div><span>风险关注</span><strong>${data.risks.length}</strong></div></section><section class="modules">${cards.map((c, i) => `<button class="card ${i == 0 ? "large dark" : ""} ${i == 4 ? "large" : ""}" onclick="${c[0] == "home" ? "document.getElementById('today').scrollIntoView({behavior:'smooth'})" : `show('${c[0]}')`}"><div class="top"><span class="num">${c[1]}</span><span class="icon">${sections[c[0]].icon}</span></div><h2>${c[2]}</h2><p>${c[3]}</p><ul>${c[4].map((x) => `<li>${x}</li>`).join("")}</ul><footer><span>进入板块</span><b>→</b></footer></button>`).join("")}</section><section class="today" id="today"><div class="eyebrow">TODAY'S COCKPIT</div><h2>今日驾驶舱</h2><div class="daily"><div class="panel"><h3>今日 Top 3</h3>${rows("priorities")}</div><div class="panel"><h3>Meetings</h3><div class="row"><i></i><input value="10:30 月报进度同步"></div><div class="row"><i></i><input value="15:00 WIP Review"></div></div><div class="panel"><h3>Follow-ups</h3>${rows("followups")}</div><div class="panel"><h3>Risks / Issues</h3>${rows("risks")}</div></div></section>`;
      }
      const reads = {
        pharmacy: {
          title: "中国零售药房与商业卓越周报",
          meta: "最新一期 · 2026年8月3日—8月9日",
          body: `<h3>本期最重要的判断</h3><p>医保正在把零售药店从“自由采购、自由定价、看销售结果”的渠道，逐渐变成采购、价格、供应和医保资质都高度数据化管理的终端。</p><h3>本期重点</h3><p><b>01 湖南量价比较指数</b><br>异常高价已开始直接影响医保定点经营资格。IMS增长需要拆分 Volume Growth、Price Effect 与 Mix Effect。</p><p><b>02 集采“三进”</b><br>渠道评价不能只看药店是否愿意进货，也要看厂家和商业公司的稳定供应能力。建议增加 Listing Rate、In-stock Rate 与 Order Fulfillment Rate。</p><p><b>03 有效门店漏斗</b><br>Total Stores → Eligible Stores → 医保 Stores → Listed Stores → Stocking Stores → Active Offtake Stores。</p><p><b>04 省级招采平台</b><br>药店采购数据将成为 IMS、商业发货、库存和 Offtake 的外部校验来源。</p><p><b>05 医保资质稀缺化</b><br>客户潜力应从门店数量转向 Effective Stores × Patient Access × Service Capability × Category Fit。</p><div class="panel"><b>对本周工作的建议</b><p>在月报和客户分析中增加价格风险、供应履约、有效门店与医保资质四个观察维度。</p></div>`,
        },
        english: {
          title: "English for Work — Session 14 (C1)",
          meta: "最新一期 · 工作日 21:00 更新",
          body: `<h3>Giving a concise executive update when things are off track</h3><p>A strong update usually follows: <b>Status → Driver → Impact → Action.</b></p><h3>Meeting phrasing</h3><p><b>We're currently tracking below target, primarily due to weaker-than-expected performance in several key accounts.</b></p><p><b>We've isolated the main drivers and identified two corrective actions. I'll focus on those rather than walk through every variance.</b></p><p><b>Let me separate what's temporary from what's structural.</b></p><h3>Cross-functional phrasing</h3><p>We're still awaiting the final input from Sales, which is the remaining dependency for completing the analysis.</p><p>To keep Friday's review on track, could we align on Thursday noon as the cut-off for final inputs?</p><h3>Today's word bank</h3><p><b>shortfall</b> · track below target · corrective action · structural · course-correct · trajectory</p><h3>Presentation phrase of the day</h3><p><b>The gap is manageable, but the trajectory needs attention.</b></p><div class="panel"><b>Communication upgrade</b><p>When explaining underperformance, give the diagnosis briefly, then spend most of your airtime on what it means and what you're doing about it.</p></div>`,
        },
      };
      function readingPage() {
        const fallback = (reads.english.meta || "").includes("备用");
        return `<section class="intro"><div class="eyebrow">DAILY INPUT</div><h1>每日阅读</h1><p>最新内容已接入工作台。点击卡片即可阅读全文。</p></section>${readingStatus()}<section class="subgrid"><article class="sub" onclick="openRead('pharmacy')" style="cursor:pointer"><span>每周一更新</span><h3>China Retail Pharmacy Brief</h3><p>中国零售药房趋势与销售运营影响</p><b>阅读最新一期 →</b></article><article class="sub"><span>知识资产</span><h3>Commercial Excellence</h3><p>CE 方法论、指标与业务实践</p><b>内容接入中</b></article><article class="sub" onclick="openRead('english')" style="cursor:pointer"><span>每天 08:20</span><h3>Advanced English Practice</h3><p>高级商务英语精进 · 每日完整课程</p><i class="status-pill ${fallback ? "fallback" : ""}">${fallback ? "备用课程" : "AI 完整版"}</i><br><b>阅读今日课程 →</b></article><article class="sub"><span>周末更新</span><h3>Weekend Long Read</h3><p>周末深度阅读与思考</p><b>内容接入中</b></article></section>`;
      }
      function openRead(key) {
        let a = reads[key],
          download =
            key === "english"
              ? '<a href="./downloads/english-practice-latest.pdf" download style="display:inline-block;margin:0 0 24px;padding:11px 18px;border-radius:999px;background:#dca6c7;color:#3f3154;text-decoration:none;font:700 13px Arial,sans-serif;box-shadow:0 6px 18px #a97bb533">下载核心学习语句 PDF ↓</a>'
              : "";
        view.innerHTML = `<button class="back" onclick="show('reading')">← 返回每日阅读</button><section class="intro" style="margin-top:28px"><div class="eyebrow">${a.meta}</div><h1>${a.title}</h1></section>${download}<article class="panel" style="line-height:1.8;max-width:850px">${a.body}</article>`;
        scrollTo(0, 0);
      }
      function page(id) {
        if (id === "reading") return readingPage();
        let s = sections[id],
          items = subs[id];
        return `<section class="intro"><div class="eyebrow">${s.en}</div><h1>${s.cn}</h1><p>${id === "reporting" ? "把每月重复工作固定成流程，让检查、分析与输出有迹可循。" : id === "wip" ? "从总览发现信号，逐层下钻到客户和 SKU，最终落到行动。" : "不是资料仓库，而是不断复用、连接和演进的分析资产。"}</p></section><section class="${id === "reporting" ? "workflow" : "subgrid"}">${items.map((x, i) => `<article class="sub"><span>0${i + 1}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join("")}</section>${id === "knowledge" ? '<section class="today"><div class="daily"><article class="panel"><h3>知识条目模板</h3><p>Concept · Business Question · Framework · Metrics · Example · Project Application</p></article><article class="panel"><h3>会议条目模板</h3><p>Meeting · Decision · Action · Owner · Deadline · Open Question · Knowledge</p></article></div></section>' : ""}`;
      }
      async function loadReading() {
        try {
          let r = await fetch("./reading-data.json?ts=" + Date.now());
          if (r.ok) {
            let fresh = await r.json();
            Object.assign(reads, fresh);
          }
        } catch (e) {
          console.warn("Using bundled reading content");
        }
      }
      function show(id) {
        document
          .querySelectorAll("nav button")
          .forEach((x) => x.classList.toggle("active", x.dataset.id === id));
        crumb.textContent = sections[id].en + " / " + sections[id].cn;
        view.innerHTML = id === "home" ? home() : page(id);
        if (id === "home") {
          const modules = view.querySelector(".modules");
          if (modules) modules.insertAdjacentHTML("beforebegin", readingStatus());
        }
        scrollTo(0, 0);
      }
      loadReading().finally(() => show("home"));
    </script>
  </body>
</html>
